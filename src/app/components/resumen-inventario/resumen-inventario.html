<div class="resumen-card mb-4 p-3 bg-white border rounded shadow-sm d-flex flex-wrap justify-content-between align-items-center gap-3">
  <div>
    <span class="text-muted small text-uppercase fw-semibold d-block">Valor Total del Inventario Seleccionado</span>
    <span class="h4 mb-0 fw-bold text-success">{{ valorTotal() | currency:'PEN':'S/ ' }}</span>
  </div>
  <div class="d-flex gap-4">
    <div>
      <span class="text-muted small d-block">Variedad en vista:</span>
      <span class="fw-semibold">{{ productos().length }} tipos de producto</span>
    </div>
    <div>
      <span class="text-muted small d-block">Unidades en stock:</span>
      <span class="fw-semibold">{{ unidadesTotales() }} unidades</span>
    </div>
  </div>
</div>
